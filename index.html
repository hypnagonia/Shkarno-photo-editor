<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0e0e0e" />
    <script>
      // Theme before first paint (no flash): dark unless chosen otherwise under ⋯ (main.ts).
      (function () {
        var t = "dark";
        try { t = localStorage.getItem("theme") || "dark"; } catch (e) {}
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0e0e0e" : "#ffffff";
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Shkarno" />
    <meta name="description" content="RAW, ProRAW and HEIC development in the browser. Photos never leave the device." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>Shkarno</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/pwa.ts"></script>
  </body>
</html>
